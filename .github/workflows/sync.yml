name: Sync to Amazon ECS

env:
  aws_region: eu-west-2
  s3_bucket: exercism-v3-icons

on:
  push:
    branches:
      - main
  schedule:
    - cron: 50 4 * * *
  workflow_dispatch:

jobs:
  deploy:
    name: Upload icons to S3
    if: github.repository_owner == 'exercism' # Stops this job from running on forks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_DEPLOY_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.aws_region }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Upload assets to s3
        run: |
          aws s3 sync exercises    s3://${{ env.s3_bucket }}/exercises/    --acl public-read --no-progress --cache-control "max-age=86400, s-maxage=31536000"
          aws s3 sync tracks       s3://${{ env.s3_bucket }}/tracks/       --acl public-read --no-progress --cache-control "max-age=86400, s-maxage=31536000"
          aws s3 sync placeholders s3://${{ env.s3_bucket }}/placeholders/ --acl public-read --no-progress --cache-control "max-age=86400, s-maxage=31536000"
          aws s3 sync key-features s3://${{ env.s3_bucket }}/key-features/ --acl public-read --no-progress --cache-control "max-age=86400, s-maxage=31536000"
          aws s3 sync bootcamp     s3://${{ env.s3_bucket }}/bootcamp/     --acl public-read --no-progress --cache-control max-age=100
          aws s3 sync meta         s3://${{ env.s3_bucket }}/meta/         --acl public-read --no-progress --cache-control "max-age=86400, s-maxage=31536000"
          
      # The website uses this to know which icons actually exist, so it can
      # render its fallback directly rather than pointing at a URL that 403s.
      # It reads the manifest straight out of the bucket, so unlike the icons
      # themselves this doesn't want to be public.
      # See Icons::RetrieveManifest in the website repo.
      - name: Generate and upload the manifest
        run: |
          find exercises tracks placeholders key-features bootcamp meta -type f |
            jq -R -s 'split("\n") | map(select(length > 0)) | sort' > manifest.json
          aws s3 cp manifest.json s3://${{ env.s3_bucket }}/manifest.json --acl private

      - name: Gather files to invalidate in CloudFront
        uses: actions/github-script@d556feaca394842dc55e4734bf3bb9f685482fa0
        if: github.event_name == 'push' # Don't run on scheduled runs
        id: invalidate-file-paths
        with:
          result-encoding: string
          script: |
            // A push can contain several commits, so look at every file
            // changed between the old and new head, not just the head commit.
            const { before, after } = context.payload
            const files = /^0+$/.test(before)
              ? (await github.rest.repos.getCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: after
                })).data.files
              : (await github.rest.repos.compareCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  base: before,
                  head: after
                })).data.files

            const filesToInvalidate = []

            for (const file of files ?? []) {
              // Don't invalidate new files
              if (file["status"] == "added") {
                continue
              }

              if (file["filename"].startsWith("exercises/") ||
                  file["filename"].startsWith("tracks/") ||
                  file["filename"].startsWith("placeholders/") ||
                  file["filename"].startsWith("key-features/") ||
                  file["filename"].startsWith("bootcamp/") ||
                  file["filename"].startsWith("meta/")) {
                filesToInvalidate.push("/" + file["filename"])
              }
            }

            return filesToInvalidate.join(" ")

      # Requests for icons go through Cloudflare, then CloudFront, then S3.
      # CloudFront has to be cleared first, or Cloudflare would fetch the old
      # icon from CloudFront again.
      - name: Invalidate assets in CloudFront
        if: github.event_name == 'push' # Don't run on scheduled runs
        env:
          PATHS: ${{ steps.invalidate-file-paths.outputs.result }}
        run: |
          if [ -n "$PATHS" ]; then
            # $PATHS is deliberately unquoted so each path is a separate argument
            id=$(aws cloudfront create-invalidation --distribution-id E3L749HRPZHLFS --paths $PATHS --query Invalidation.Id --output text)
            aws cloudfront wait invalidation-completed --distribution-id E3L749HRPZHLFS --id "$id"
          fi

      - name: Purge assets in Cloudflare
        if: github.event_name == 'push' # Don't run on scheduled runs
        env:
          PATHS: ${{ steps.invalidate-file-paths.outputs.result }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
        run: |
          if [ -n "$PATHS" ]; then
            # Cloudflare accepts at most 100 URLs per purge request
            printf '%s\n' $PATHS | sed 's|^|https://assets.exercism.org|' |
              jq -R . | jq -s -c '[range(0; length; 100) as $i | .[$i:$i+100]] | .[] | {files: .}' |
              while read -r body; do
                curl --fail-with-body -sS -X POST \
                  "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
                  -H "Authorization: Bearer $CLOUDFLARE_CACHE_PURGE_TOKEN" \
                  -H "Content-Type: application/json" \
                  --data "$body"
              done
          fi
